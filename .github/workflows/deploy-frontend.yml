name: Deploy frontend

# 프론트 정적 빌드 → S3 → CloudFront 무효화.
# AWS 인증은 OIDC(장기 액세스 키 없음). 필요한 GitHub 설정:
#   secrets.AWS_DEPLOY_ROLE_ARN   — GitHub OIDC를 신뢰하는 IAM 역할
#   secrets.VITE_GOOGLE_CLIENT_ID — 빌드에 박히는 공개값
#   vars.S3_BUCKET, vars.CLOUDFRONT_DISTRIBUTION_ID
on:
  push:
    branches: [main]
    paths: ["frontend/**", ".github/workflows/deploy-frontend.yml"]
  workflow_dispatch:

permissions:
  id-token: write      # OIDC 토큰 발급
  contents: read

concurrency:
  group: deploy-frontend
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run build
        env:
          VITE_GOOGLE_CLIENT_ID: ${{ secrets.VITE_GOOGLE_CLIENT_ID }}

      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ap-northeast-2

      # 해시가 박힌 정적 자산은 길게 캐시, index.html은 캐시하지 않는다.
      # index.html을 캐시하면 배포해도 사용자가 옛 번들을 계속 받는다.
      - name: Upload assets (immutable)
        run: |
          aws s3 sync dist s3://${{ vars.S3_BUCKET }} \
            --delete --exclude index.html \
            --cache-control "public,max-age=31536000,immutable"
      - name: Upload index.html (no-cache)
        run: |
          aws s3 cp dist/index.html s3://${{ vars.S3_BUCKET }}/index.html \
            --cache-control "no-cache,no-store,must-revalidate"

      - name: Invalidate CloudFront
        run: |
          aws cloudfront create-invalidation \
            --distribution-id ${{ vars.CLOUDFRONT_DISTRIBUTION_ID }} \
            --paths "/*"
