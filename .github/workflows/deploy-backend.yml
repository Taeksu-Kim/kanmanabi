name: Deploy backend

# EC2 배포를 SSM Run Command로 한다. SSH를 쓰지 않으므로 22번 포트를
# 개발자 IP로 잠근 채로도 자동 배포가 된다(러너 IP를 열 필요가 없다).
#
# 필요한 GitHub 설정:
#   secrets.AWS_DEPLOY_ROLE_ARN — OIDC 역할 (ssm:SendCommand 권한 포함)
#   vars.EC2_INSTANCE_ID
on:
  push:
    branches: [main]
    paths:
      - "backend/**"
      - "docker-compose.yml"
      - "scripts/deploy_on_ec2.sh"
      - ".github/workflows/deploy-backend.yml"
  workflow_dispatch:

permissions:
  id-token: write
  contents: read

concurrency:
  group: deploy-backend
  cancel-in-progress: false      # 배포 중단은 위험하므로 취소하지 않는다

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ap-northeast-2

      - name: Run deploy script on EC2
        run: |
          set -euo pipefail
          CMD=$(aws ssm send-command \
            --instance-ids "${{ vars.EC2_INSTANCE_ID }}" \
            --document-name AWS-RunShellScript \
            --comment "deploy ${GITHUB_SHA::7}" \
            --parameters 'commands=["bash /home/ubuntu/kanmanabi/scripts/deploy_on_ec2.sh"]' \
            --query 'Command.CommandId' --output text)
          echo "command id: $CMD"

          # 완료까지 대기 (배포는 빌드 포함이라 몇 분 걸릴 수 있다)
          for i in $(seq 1 60); do
            STATUS=$(aws ssm get-command-invocation --command-id "$CMD" \
              --instance-id "${{ vars.EC2_INSTANCE_ID }}" --query Status --output text 2>/dev/null || echo Pending)
            [ "$STATUS" != "Pending" ] && [ "$STATUS" != "InProgress" ] && break
            sleep 10
          done

          echo "── stdout ──"
          aws ssm get-command-invocation --command-id "$CMD" \
            --instance-id "${{ vars.EC2_INSTANCE_ID }}" --query StandardOutputContent --output text
          echo "── stderr ──"
          aws ssm get-command-invocation --command-id "$CMD" \
            --instance-id "${{ vars.EC2_INSTANCE_ID }}" --query StandardErrorContent --output text

          echo "status: $STATUS"
          [ "$STATUS" = "Success" ]
